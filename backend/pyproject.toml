[project]
name = "cythan-ai"
version = "0.1.0"
description = "CyThan AI FastAPI"
authors = [
    { name = "Ndoh Kamsiyochukwu", email = "codespace176@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141.1",
    "google-genai>=2.17.0",
    "python-dotenv>=1.2.2",
    "uvicorn>=0.52.1",
]

[project.scripts]
cythan-ai = "cythan_ai:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
]

[tool.uv]
package = false