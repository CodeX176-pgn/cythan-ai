<!DOCTYPE html>
<html lang="en">
    <head>
    <meta name="theme-color" content="#080b12">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="./manifest.webmanifest">
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; script-src 'self' https://cdn.jsdelivr.net https://unpkg.com https://cdnjs.cloudflare.com; style-src 'self' https://cdnjs.cloudflare.com; style-src-attr 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' https://cythan-ai.onrender.com; form-action 'self'; upgrade-insecure-requests">

        <title>CyThan AI</title>

        <script defer src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
        <script defer src="https://unpkg.com/lucide@latest"></script>
        <script defer src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/highlight.min.js"></script>
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/styles/github-dark.min.css"
        >

        <!------------------FAVICON------------------------------------------------>
        <link rel="icon" type="image/png" href="images/cythan-icon.png">
        <link rel="icon" type="image/png" sizes="32x32" href="images/cythan-icon.png">
        <link rel="icon" type="image/png" sizes="16x16" href="images/cythan-icon.png">
        <link rel="apple-touch-icon" href="images/cythan-icon.png">

        <!---------------STYLESHEETS---------------->

        <link rel="stylesheet" href="css/base.css">
        <link rel="stylesheet" href="css/layout.css">
        <link rel="stylesheet" href="css/sidebar.css">
        <link rel="stylesheet" href="css/chat.css">
        <link rel="stylesheet" href="css/settings.css">
        <link rel="stylesheet" href="css/about.css">
        <link rel="stylesheet" href="css/responsive.css">
    </head>

    <body>

        <div class="app">

            <!-- Sidebar -->
            <aside class="sidebar" id="sidebar">

                <div class="sidebar-header">
                    <div class="logo">
                        <div class="logo-icon" aria-hidden="true">
                            <img class="theme-logo theme-logo-light"
                                 src="images/cythan-logo-light.png"
                                 alt="">
                            <img class="theme-logo theme-logo-dark"
                                 src="images/cythan-logo-dark.png"
                                 alt="">
                        </div>
                        <span>CyThan AI</span>
                    </div>

                    <button class="sidebar-close" id="sidebarClose"
                            type="button" aria-label="Close sidebar" title="Close sidebar">
                        <i data-lucide="x"></i>
                    </button>
                </div>

                <button class="new-chat-btn" id="newChatBtn" type="button">
                    <i data-lucide="plus"></i>
                    <span>New Chat</span>
                </button>

                <div class="chat-history">
    <!-- Chat history generated dynamically by sidebar.js -->
                </div>
                
                <div class="sidebar-footer">

                    <button
                        class="sidebar-item"
                        id="settingsBtn"
                        type="button"
                    >
                        <i data-lucide="settings"></i>
                        <span>Settings</span>
                    </button>

                    <button
                        class="sidebar-item"
                        id="aboutBtn"
                        type="button"
                    >
                        <i data-lucide="info"></i>
                        <span>About CyThan AI</span>
                    </button>

                </div>

            </aside>

            <div class="sidebar-overlay" id="sidebarOverlay"></div>


            <!-- Main Content -->
            <main class="main">

                <!-- Top Bar -->
                <header class="topbar">

                    <button class="menu-btn" id="menuBtn" type="button"
                            aria-label="Open sidebar" title="Open sidebar">
                        <i data-lucide="menu"></i>
                    </button>

                    <div class="model-name">
                        <span class="status-dot"></span>
                        <span>CyThan AI</span>
                    </div>

                </header>


                <!-- Chat -->
                <section class="chat-container">

                    <!-- Welcome Screen -->
                    <div class="welcome-screen" id="welcomeScreen">

                        <div class="welcome-logo" aria-hidden="true">
                            <img class="theme-logo theme-logo-light"
                                 src="images/cythan-logo-light.png" alt="">
                            <img class="theme-logo theme-logo-dark"
                                 src="images/cythan-logo-dark.png" alt="">
                        </div>

                        <h1>
                            Welcome to <span>CyThan AI</span>
                        </h1>

                        <p>
                            Your intelligent AI assistant for learning,
                            coding, creativity and more.
                        </p>

                        <div class="suggestions">

                            <button class="suggestion-card">
                                <strong><i data-lucide="code-2"></i> Coding</strong>
                                <span>Help me write Python code</span>
                            </button>

                            <button class="suggestion-card">
                                <strong><i data-lucide="brain"></i> Learn</strong>
                                <span>Explain a difficult concept</span>
                            </button>

                            <button class="suggestion-card">
                                <strong><i data-lucide="calculator"></i> Mathematics</strong>
                                <span>Help me solve a math problem</span>
                            </button>

                            <button class="suggestion-card">
                                <strong><i data-lucide="lightbulb"></i> Ideas</strong>
                                <span>Help me brainstorm ideas</span>
                            </button>

                        </div>

                    </div>


                    <!-- Messages -->
                    <div class="messages" id="messages">
                        <!-- Messages will be inserted here -->
                    </div>

                </section>


                <!-- Composer -->
                <footer class="composer-area">

                    <div class="composer">

                        <textarea
                            id="messageInput"
                            placeholder="Message CyThan AI..."
                            rows="1"
                            aria-label="Message CyThan AI"
                        ></textarea>

                        <div class="composer-bottom">

                            <div class="composer-modes">

                                <button
                                    class="composer-mode active"
                                    id="chatModeBtn"
                                    type="button"
                                    aria-pressed="true"
                                >
                                    <i data-lucide="message-circle"></i>
                                    <span>Chat</span>
                                </button>

                            </div>

                            <button
                                class="send-btn"
                                id="sendBtn"
                                type="button"
                                aria-label="Send message"
                                title="Send message"
                            >
                                <i
                                    data-lucide="send"
                                    id="sendIcon"
                                ></i>
                            </button>

                        </div>

                    </div>

                    <p class="disclaimer">
                        CyThan AI can make mistakes. Check important information.
                    </p>

                </footer>
            </main>

        </div>

        <script type="module" src="js/app.js"></script>


</body>
</html>
